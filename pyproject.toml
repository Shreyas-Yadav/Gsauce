[project]
name = "rapx"
version = "0.1.0"
description = "AI rap explainer video generator powered by Gemini 4 Argon, Lyria, and HyperFrames"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.30.1",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "pronouncing>=0.2.0",
    "librosa>=0.11.0",
    "whisperx>=3.8.6",
]

[project.scripts]
rapx = "rapx.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["."]
