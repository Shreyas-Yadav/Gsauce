<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b0f19;
        --ink: #f8fafc;
        --accent: #38bdf8;
        --font-display: "Archivo Black", sans-serif;
        --font-mono: "Space Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        background: #0b0f19;
      }
      #ring-clip {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 48px;
      }
      #ring-visual {
        width: 360px;
        height: 360px;
        border-radius: 50%;
        border: 12px dashed var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #node-dot {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #f43f5e;
      }
      #title-inner {
        color: var(--ink);
        font-size: 84px;
        font-weight: 900;
        letter-spacing: -0.02em;
        text-align: center;
      }
      #subtitle-inner {
        color: var(--accent);
        font-family: var(--font-mono);
        font-size: 40px;
        font-weight: 700;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <div id="ring-clip" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="ring-visual">
          <div id="node-dot"></div>
        </div>
        <h1 id="title-inner">RAPX HELLO WORLD</h1>
        <p id="subtitle-inner">CONSISTENT HASHING // 92 BPM</p>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#ring-visual",
        { rotation: 0, scale: 0.7, opacity: 0.6 },
        { rotation: 360, scale: 1.05, opacity: 1, duration: 5, ease: "none" },
        0
      );
      tl.fromTo(
        "#node-dot",
        { scale: 0.6 },
        { scale: 1.4, duration: 0.65, repeat: 6, yoyo: true, ease: "power2.inOut" },
        0
      );
      tl.fromTo(
        "#title-inner",
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.7)" },
        0.1
      );
      tl.fromTo(
        "#subtitle-inner",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.4
      );
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
