# rapx configuration
gcp:
  project_id: "clickwork-1d7f2a"
  location: "global"      # Verified in Phase 0 ("global" works; "us-central1" returns 400)
  vertexai: true          # Use Vertex AI with ADC

models:
  llm: "gemini-4-argon"        # Flagship reasoning model for core creative stages (lyrics, direct, initial code)
  fast_llm: "gemini-3.8-flash" # High-speed model (128 tok/s) for outline, fix, factcheck, critique & code_critique_fix
  music: "lyria-3-pro-preview" # Verified in Phase 0 ("lyria-3-pro-preview" & "lyria-3-clip-preview" work)

audio:
  bpm: 92
  time_signature: "4/4"
  takes: 2
  genre: "boom-bap hip-hop"
  mood: "confident, rhythmic, educational, crisp drums, warm bassline"

video:
  width: 1080
  height: 1920
  fps: 30
  duration_min_sec: 30
  duration_max_sec: 60

pipeline:
  max_fix_retries: 2
  max_render_retries: 2
  max_critique_rounds: 2
  runs_dir: "runs"
  cache_enabled: true

pricing:
  # Gemini 4 Argon & Gemini 3.8 Flash pricing per 1M tokens (USD)
  argon_input_per_1m: 2.00
  argon_output_per_1m: 10.00
  flash_input_per_1m: 0.30
  flash_output_per_1m: 2.50
  lyria_per_take: 0.08
